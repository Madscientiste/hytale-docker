services:
  hytale:
    # image: ghcr.io/madscientiste/hytale-docker:latest
    # Or build locally: build: .
    build: .
    restart: unless-stopped
    stop_grace_period: 60s # time to save the world on docker compose stop (Docker's default is 10s)
    container_name: hytale
    tty: true
    stdin_open: true
    # Settings: copy .env.example to .env and change values there.
    # Each line below reads its value from .env, falling back to the default shown.
    environment:
      # Container & Permissions
      - HOST_UID=${UID:-1000}
      - HOST_GID=${GID:-1000}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO} # ERROR, WARN, INFO, DEBUG

      # Server Download
      - VERSION=${VERSION:-LATEST} # LATEST, or pin a version such as 0.7.7 (older date versions like 2026.01.17-4b0f30090 also work)
      - PATCHLINE=${PATCHLINE:-release} # Patchline/branch (typically 'release' or 'pre-release')
      - FORCE_DOWNLOAD=${FORCE_DOWNLOAD:-false} # Force re-download if true
      - FORCE_UPDATE_CHECK=${FORCE_UPDATE_CHECK:-false} # true: skip the 1-hour update check cooldown

      # Restarts (docker exec hytale hy-restart works in every mode)
      - RESTART_MODE=${RESTART_MODE:-off} # off | schedule (daily at RESTART_TIME) | on-update (when a new version is out)
      - RESTART_TIME=${RESTART_TIME:-04:00} # Daily restart time for RESTART_MODE=schedule (HH:MM, time zone TZ)
      - RESTART_WARN_MINUTES=${RESTART_WARN_MINUTES:-5} # Warn players this many minutes before a restart
      - RESTART_CHECK_MINUTES=${RESTART_CHECK_MINUTES:-60} # How often RESTART_MODE=on-update looks for a new version (minimum 10)
      - TZ=${TZ:-UTC} # Container time zone

      # Server Configuration
      - SERVER_NAME=${SERVER_NAME:-My Hytale Server} # Server name displayed to players
      - MOTD=${MOTD:-Welcome to our Hytale server!} # Message of the day
      - MAX_PLAYERS=${MAX_PLAYERS:-50} # Maximum number of players
      - MAX_VIEW_RADIUS=${MAX_VIEW_RADIUS:-32} # Maximum view radius (chunks)
      - DEFAULT_WORLD=${DEFAULT_WORLD:-default} # Default world name
      - DEFAULT_GAME_MODE=${DEFAULT_GAME_MODE:-Adventure} # Adventure or Creative
      - SERVER_PASSWORD=${SERVER_PASSWORD:-} # Server password (empty for public)

      # Mods: download links (.jar/.zip), comma-separated; downloaded once into data/mods
      - MODS=${MODS:-}

      # Recommended plugins (docs/env-variables.md#recommended-plugins)
      - ENABLE_WEBSERVER=${ENABLE_WEBSERVER:-true} # Web server used by Query and metrics (port 5523/tcp)
      - ENABLE_QUERY=${ENABLE_QUERY:-true} # Server info and player count over HTTP
      - ENABLE_METRICS=${ENABLE_METRICS:-true} # Prometheus metrics
      - ENABLE_PERFORMANCE_SAVER=${ENABLE_PERFORMANCE_SAVER:-true} # Lowers load under pressure

      # JVM & Server Startup
      - INIT_MEMORY=${INIT_MEMORY:-8G} # Initial Java heap size
      - MAX_MEMORY=${MAX_MEMORY:-16G} # Maximum Java heap size
      - JVM_OPTS=${JVM_OPTS:-} # Additional JVM options
      - JVM_XX_OPTS=${JVM_XX_OPTS:-} # Additional JVM -XX: options
      - BIND_ADDRESS=${BIND_ADDRESS:-} # IP address to bind to (empty = all interfaces)
      - TRANSPORT_TYPE=${TRANSPORT_TYPE:-} # Transport type (e.g., 'quic')
      - AUTH_MODE=${AUTH_MODE:-} # authenticated (default), offline or insecure

      # Server Options (docs/env-variables.md#server-options)
      - BOOT_COMMANDS=${BOOT_COMMANDS:-} # Console commands to run at every start, separated by ;
      - SERVER_LOG=${SERVER_LOG:-} # Server log levels, e.g. INFO or WARNING,SomeLogger:FINE
      - DISABLE_SENTRY=${DISABLE_SENTRY:-false} # true: do not send crash reports to Hytale
      - IGNORE_BROKEN_MODS=${IGNORE_BROKEN_MODS:-false} # true: start even when a mod fails to load
      - UNIVERSE_DIR=${UNIVERSE_DIR:-} # Worlds folder; empty: /data/universe
      - EXTRA_MODS_DIRS=${EXTRA_MODS_DIRS:-} # More mod folders, separated by ;
      - VERIFY_WORLDS=${VERIFY_WORLDS:-false} # true: check every world before the server starts
      - RECOVERY_MODE=${RECOVERY_MODE:-} # With VERIFY_WORLDS: REGENERATE or FROM_BACKUP_OR_REGENERATE
      - SERVER_ARGS=${SERVER_ARGS:-} # Any other server options, separated by spaces

      # Login & Health
      - AUTH_REFRESH_HOURS=${AUTH_REFRESH_HOURS:-24} # Refresh the Hytale login this often while running
      - MACHINE_ID=${MACHINE_ID:-} # Fixed hardware ID; empty: generated once, kept in data/machine-id
      - HEALTH_STARTUP_MINUTES=${HEALTH_STARTUP_MINUTES:-15} # Startup may take this long before the container reports unhealthy

      # Backup Configuration
      - ENABLE_BACKUPS=${ENABLE_BACKUPS:-true} # Enable/disable backups (default: true)
      - BACKUP_DIR=${BACKUP_DIR:-/data/backups} # Absolute path for backups (default: /data/backups)
      - BACKUP_FREQUENCY=${BACKUP_FREQUENCY:-30} # Backup interval in minutes (default: 30)
      - BACKUP_MAX_COUNT=${BACKUP_MAX_COUNT:-5} # Maximum number of backups to keep (default: 5)
      # Example: Use separate volume for backups
      # - BACKUP_DIR=/backup

      # RCON Configuration
      - RCON_ENABLED=${RCON_ENABLED:-true} # Enable/disable RCON plugin (default: true)
      - RCON_VERSION=${RCON_VERSION:-} # Empty: the plugin version tested with this image (checksum verified); or latest, or a tag
      - RCON_HOST=${RCON_HOST:-0.0.0.0} # Address inside the container; 0.0.0.0 so the port below works. Who can connect is set by the port line
      - RCON_PORT=${RCON_PORT:-25575} # RCON port (default: 25575)
      - RCON_PASSWORD=${RCON_PASSWORD:-} # Empty: a random password, saved in data/.rcon-password
      - RCON_PASSWORD_HASH=${RCON_PASSWORD_HASH:-} # Pre-hashed password from gen-psswd (overrides RCON_PASSWORD for the plugin; both set: they must match)
      - RCON_MAX_CONNECTIONS=${RCON_MAX_CONNECTIONS:-10} # Maximum concurrent RCON connections (default: 10)
      - RCON_MAX_FRAME_SIZE=${RCON_MAX_FRAME_SIZE:-4096} # Maximum RCON frame size in bytes (default: 4096)
      - RCON_READ_TIMEOUT_MS=${RCON_READ_TIMEOUT_MS:-30000} # RCON read timeout in milliseconds (default: 30000)
      - RCON_CONNECTION_TIMEOUT_MS=${RCON_CONNECTION_TIMEOUT_MS:-5000} # RCON connection timeout in milliseconds (default: 5000)
    volumes:
      - "./data:/data"
      # Optional: Mount separate volume for backups
      # - "./backups:/backup"
    ports:
      - "5520:5520/udp" # Hytale UDP/QUIC
      # RCON: only this host can connect (unencrypted protocol; never open it to the internet).
      # Inside the container you need no port: docker exec hytale rcon-cli who
      - "127.0.0.1:${RCON_PORT:-25575}:${RCON_PORT:-25575}/tcp"
      # - "5523:5523/tcp" # Web server plugin (Query, metrics); needs a login
